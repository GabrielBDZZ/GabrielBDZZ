# Gera as imagens dinâmicas do README (gráfico 3D e snake).
# Roda todo dia e também pode ser disparado manualmente na aba Actions.
name: Atualizar perfil

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contrib-3d:
    name: Gráfico 3D de contribuições
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || { git commit -m "chore: atualiza gráfico 3D de contribuições" && git push; }

  snake:
    name: Snake de contribuições
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#4f46e5
            dist/snake-dark.svg?palette=github-dark&color_snake=#818cf8

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
